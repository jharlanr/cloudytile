name: cloudytile-spectral-sweep
program: /oak/stanford/groups/cyaolai/JoshRines/repos/cloudy-tile/engine/training/run_training.py
method: grid
metric:
  name: val_precision
  goal: maximize

parameters:
  lr:
    values: [1e-4, 1e-3, 1e-2]

  batch_size:
    values: [16, 32]

  weight_decay:
    value: 1e-4

  epochs:
    value: 200

  img_size:
    value: 512

  channels:
    values:
      - [16, 32, 64]
      - [32, 64, 128]

  fc_layers:
    values:
      - [128]
      - [128, 64]

  use_scheduler:
    value: true

  # Match the sweep metric goal
  optimize_metric:
    value: precision

  # ==========================================================================
  # SPECTRAL BAND COMBINATIONS
  # ==========================================================================
  # Format: [channel_list, in_channels]
  #
  # Base combinations:
  #   RGB, RGB+SWIR1, RGB+SWIR2, RB+SWIR1, RB+SWIR2, B+SWIR1, B+SWIR2
  # Each with and without NIR = 14 total combinations
  #
  # Note: nc_channels is a list of band names, in_channels is the count
  # ==========================================================================

  nc_channels:
    values:
      # --- WITHOUT NIR ---
      # RGB only (3 channels)
      - [red, green, blue]
      # RGB + SWIR1 (4 channels)
      - [red, green, blue, swir1]
      # RGB + SWIR2 (4 channels)
      - [red, green, blue, swir2]
      # RB + SWIR1 (3 channels) - no green
      - [red, blue, swir1]
      # RB + SWIR2 (3 channels) - no green
      - [red, blue, swir2]
      # B + SWIR1 (2 channels)
      - [blue, swir1]
      # B + SWIR2 (2 channels)
      - [blue, swir2]

      # --- WITH NIR ---
      # RGB + NIR (4 channels)
      - [red, green, blue, nir]
      # RGB + NIR + SWIR1 (5 channels)
      - [red, green, blue, nir, swir1]
      # RGB + NIR + SWIR2 (5 channels)
      - [red, green, blue, nir, swir2]
      # RB + NIR + SWIR1 (4 channels)
      - [red, blue, nir, swir1]
      # RB + NIR + SWIR2 (4 channels)
      - [red, blue, nir, swir2]
      # B + NIR + SWIR1 (3 channels)
      - [blue, nir, swir1]
      # B + NIR + SWIR2 (3 channels)
      - [blue, nir, swir2]

      # --- ALL BANDS ---
      # Full 6-channel (RGB + NIR + SWIR1 + SWIR2)
      - [red, green, blue, nir, swir1, swir2]

  # Enable NC mode for spectral bands
  use_nc:
    value: true

command:
  - ${env}
  - python3
  - ${program}
  - --labels_csv
  - /oak/stanford/groups/cyaolai/JoshRines/repos/cloudy-tile/labels.csv
  - --image_dir
  - /oak/stanford/groups/cyaolai/JoshRines/data/jpg_tiles
  - --nc_dir
  - /oak/stanford/groups/cyaolai/JoshRines/data/cloudytile/training_nc
  - --band_stats
  - /oak/stanford/groups/cyaolai/JoshRines/data/cloudytile/band_stats.json
  - ${args}
