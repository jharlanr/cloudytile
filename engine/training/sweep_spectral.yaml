name: cloudytile-spectral-sweep
program: /oak/stanford/groups/cyaolai/JoshRines/repos/cloudy-tile/engine/training/run_training.py
method: grid
metric:
  name: val_precision
  goal: maximize

parameters:
  lr:
    values: [1e-4, 1e-3, 1e-2]

  batch_size:
    values: [16, 32]

  weight_decay:
    value: 1e-4

  epochs:
    value: 200

  img_size:
    value: 512

  channels:
    values:
      - [16, 32, 64]
      - [32, 64, 128]

  fc_layers:
    values:
      - [128]
      - [128, 64]

  # Match the sweep metric goal
  optimize_metric:
    value: precision

  # ==========================================================================
  # SPECTRAL BAND COMBINATIONS
  # ==========================================================================
  # Sentinel-2 band naming:
  #   swir16 = Band 11 (1.6μm SWIR)
  #   swir22 = Band 12 (2.2μm SWIR)
  #
  # Base combinations:
  #   RGB, RGB+SWIR16, RGB+SWIR22, RB+SWIR16, RB+SWIR22, B+SWIR16, B+SWIR22
  # Each with and without NIR = 14 total combinations + full 6-channel
  # ==========================================================================

  nc_channels:
    values:
      # --- WITHOUT NIR ---
      # RGB only (3 channels)
      - [red, green, blue]
      # RGB + SWIR16 (4 channels)
      - [red, green, blue, swir16]
      # RGB + SWIR22 (4 channels)
      - [red, green, blue, swir22]
      # RB + SWIR16 (3 channels) - no green
      - [red, blue, swir16]
      # RB + SWIR22 (3 channels) - no green
      - [red, blue, swir22]
      # B + SWIR16 (2 channels)
      - [blue, swir16]
      # B + SWIR22 (2 channels)
      - [blue, swir22]

      # --- WITH NIR ---
      # RGB + NIR (4 channels)
      - [red, green, blue, nir]
      # RGB + NIR + SWIR16 (5 channels)
      - [red, green, blue, nir, swir16]
      # RGB + NIR + SWIR22 (5 channels)
      - [red, green, blue, nir, swir22]
      # RB + NIR + SWIR16 (4 channels)
      - [red, blue, nir, swir16]
      # RB + NIR + SWIR22 (4 channels)
      - [red, blue, nir, swir22]
      # B + NIR + SWIR16 (3 channels)
      - [blue, nir, swir16]
      # B + NIR + SWIR22 (3 channels)
      - [blue, nir, swir22]

      # --- ALL BANDS ---
      # Full 6-channel (RGB + NIR + SWIR16 + SWIR22)
      - [red, green, blue, nir, swir16, swir22]

command:
  - ${env}
  - python3
  - ${program}
  - --labels_csv
  - /oak/stanford/groups/cyaolai/JoshRines/repos/cloudy-tile/labels.csv
  - --image_dir
  - /oak/stanford/groups/cyaolai/JoshRines/data/jpg_tiles
  - --nc_dir
  - /oak/stanford/groups/cyaolai/JoshRines/data/cloudytile/training_nc
  - --band_stats
  - /oak/stanford/groups/cyaolai/JoshRines/data/cloudytile/band_stats.json
  - --use_nc
  - --use_scheduler
  - ${args}
